<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#2e1245"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1540"/>
      <stop offset="100%" stop-color="#1e0e32"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291437"/>
      <stop offset="100%" stop-color="#1e0e32"/>
    </linearGradient>
    <linearGradient id="textGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="35%" stop-color="#f0dfa0"/>
      <stop offset="65%" stop-color="#f0dfa0"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8b5e1a"/>
    </linearGradient>
    <linearGradient id="mistGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6b3a9e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9b6ac8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="220" fill="url(#bg3)" rx="16"/>

  <!-- Background stars -->
  <g fill="#c9a84c" opacity="0.3">
    <circle cx="30" cy="25" r="1.3"/><circle cx="450" cy="20" r="1.5"/>
    <circle cx="460" cy="55" r="0.9"/><circle cx="18" cy="60" r="1.1"/>
    <circle cx="25" cy="180" r="1.2"/><circle cx="455" cy="175" r="1"/>
    <circle cx="12" cy="120" r="0.8"/><circle cx="470" cy="120" r="1.3"/>
  </g>

  <!-- Book shape — left page -->
  <path d="M100 42 Q102 38 108 38 L228 38 L228 148 L108 148 Q100 148 100 140 Z"
        fill="url(#pageLeft)" stroke="#6b3a9e" stroke-width="1"/>

  <!-- Book shape — right page -->
  <path d="M252 38 L370 38 Q378 38 378 46 L378 140 Q378 148 370 148 L252 148 Z"
        fill="url(#pageRight)" stroke="#6b3a9e" stroke-width="1"/>

  <!-- Book spine -->
  <path d="M228 38 Q240 35 252 38 L252 148 Q240 151 228 148 Z"
        fill="url(#spineGrad)" stroke="#c9a84c" stroke-width="0.5"/>

  <!-- Left page — stars and clouds pattern -->
  <g fill="#c9a84c" opacity="0.5">
    <circle cx="140" cy="62" r="1.5"/><circle cx="165" cy="55" r="1"/>
    <circle cx="190" cy="65" r="1.8"/><circle cx="155" cy="80" r="1.2"/>
    <circle cx="210" cy="72" r="1"/><circle cx="175" cy="90" r="0.8"/>
    <circle cx="130" cy="85" r="1.3"/>
  </g>
  <!-- Zodiac symbol (Aries-like) on left page -->
  <g stroke="#9b6ac8" stroke-width="1.5" fill="none" opacity="0.8">
    <circle cx="160" cy="115" r="14"/>
    <path d="M146 108 Q160 90 174 108"/>
    <line x1="160" y1="108" x2="160" y2="129"/>
  </g>
  <text x="160" y="143" font-family="serif" font-size="9" fill="#9b6ac8" text-anchor="middle" opacity="0.7">♈ ЗОДИАК</text>

  <!-- Right page — starry sky -->
  <g fill="#c9a84c" opacity="0.4">
    <circle cx="275" cy="58" r="1.2"/><circle cx="300" cy="52" r="1.5"/>
    <circle cx="325" cy="60" r="1"/><circle cx="350" cy="55" r="1.8"/>
    <circle cx="290" cy="72" r="0.9"/><circle cx="340" cy="75" r="1.3"/>
    <circle cx="310" cy="80" r="1"/>
  </g>
  <!-- Calligraphic Ya / Я symbol on right page -->
  <text x="315" y="130" font-family="Georgia, serif" font-size="50" font-weight="700"
        fill="none" stroke="#9b6ac8" stroke-width="1" opacity="0.55" text-anchor="middle">Я</text>
  <text x="315" y="144" font-family="serif" font-size="9" fill="#9b6ac8" text-anchor="middle" opacity="0.7">ИМЯ · СУДЬБА</text>

  <!-- Mist rising from book -->
  <g opacity="0.5" filter="url(#softblur)">
    <ellipse cx="200" cy="40" rx="30" ry="14" fill="url(#mistGrad)"/>
    <ellipse cx="240" cy="32" rx="22" ry="12" fill="url(#mistGrad)"/>
    <ellipse cx="275" cy="40" rx="28" ry="13" fill="url(#mistGrad)"/>
  </g>

  <!-- Human silhouette in mist (simplified) -->
  <g fill="none" stroke="#9b6ac8" stroke-width="1.2" opacity="0.4">
    <circle cx="240" cy="20" r="7"/>
    <path d="M240 27 L240 10"/>
    <path d="M233 14 L247 14"/>
    <path d="M240 10 L236 4"/>
    <path d="M240 10 L244 4"/>
    <!-- Arm reaching up -->
    <path d="M244 14 Q250 10 252 6"/>
    <circle cx="254" cy="5" r="2" fill="#c9a84c" opacity="0.7"/>
  </g>

  <!-- RUYO text — U and Y connected -->
  <g filter="url(#glow3)">
    <!-- R -->
    <text x="137" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
          fill="url(#textGrad3)" text-anchor="middle">R</text>
    <!-- U -->
    <text x="183" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
          fill="url(#textGrad3)" text-anchor="middle">U</text>
    <!-- Y — slightly closer -->
    <text x="225" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
          fill="url(#textGrad3)" text-anchor="middle">Y</text>
    <!-- Connecting wave under U-Y -->
    <path d="M168 192 Q186 200 204 192" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.7"/>
    <!-- O -->
    <text x="270" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
          fill="url(#textGrad3)" text-anchor="middle">O</text>
  </g>

  <!-- Letter spacing bar -->
  <line x1="118" y1="197" x2="292" y2="197" stroke="#c9a84c" stroke-width="0.6" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="205" y="212" font-family="Georgia, serif" font-size="9.5" fill="#9b6ac8"
        letter-spacing="2.5" text-anchor="middle" opacity="0.85">СОННИК · ИМЕНА · ГОРОСКОПЫ</text>
</svg>
