<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e2e"/>
      <stop offset="100%" stop-color="#0a2a3e"/>
    </linearGradient>
    <linearGradient id="textGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7ec8e3"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#1a3a6e"/>
    </linearGradient>
    <linearGradient id="starTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffe066" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="386" cy="88" r="34"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="480" height="220" fill="url(#bg2)" rx="16"/>

  <!-- Background constellation dots -->
  <g fill="#7ec8e3" opacity="0.25">
    <circle cx="30" cy="30" r="1.5"/><circle cx="60" cy="55" r="1"/>
    <circle cx="20" cy="70" r="1.8"/><circle cx="45" cy="90" r="1"/>
    <circle cx="430" cy="170" r="1.5"/><circle cx="460" cy="195" r="1"/>
    <circle cx="440" cy="25" r="1.2"/>
    <!-- Faint constellation lines -->
    <line x1="30" y1="30" x2="60" y2="55" stroke="#7ec8e3" stroke-width="0.4"/>
    <line x1="60" y1="55" x2="45" y2="90" stroke="#7ec8e3" stroke-width="0.4"/>
  </g>

  <!-- RUY text -->
  <text x="75" y="118" font-family="'Trebuchet MS', Arial, sans-serif" font-size="80" font-weight="800"
        fill="url(#textGrad2)" filter="url(#glow2)" letter-spacing="4" text-anchor="start">RUY</text>

  <!-- O circle — astrolabe -->
  <circle cx="386" cy="88" r="38" fill="url(#circleGrad)" stroke="#7ec8e3" stroke-width="1.5" opacity="0.9"/>

  <!-- Astrolabe lines inside O -->
  <g clip-path="url(#circleClip)" stroke="#7ec8e3" stroke-width="0.8" opacity="0.6">
    <!-- Cross lines -->
    <line x1="352" y1="88" x2="420" y2="88"/>
    <line x1="386" y1="54" x2="386" y2="122"/>
    <!-- Diagonal lines -->
    <line x1="362" y1="64" x2="410" y2="112"/>
    <line x1="410" y1="64" x2="362" y2="112"/>
    <!-- Inner circle -->
    <circle cx="386" cy="88" r="18" fill="none"/>
    <!-- Small tick marks -->
    <line x1="386" y1="54" x2="386" y2="59"/>
    <line x1="386" y1="117" x2="386" y2="122"/>
    <line x1="352" y1="88" x2="357" y2="88"/>
    <line x1="415" y1="88" x2="420" y2="88"/>
  </g>

  <!-- Shooting star trail through O -->
  <line x1="345" y1="58" x2="425" y2="118" stroke="url(#starTrail)" stroke-width="2.5" filter="url(#sparkle)"/>

  <!-- Star dot at end -->
  <circle cx="422" cy="116" r="3.5" fill="#ffe066" filter="url(#sparkle)"/>
  <circle cx="422" cy="116" r="1.5" fill="#ffffff"/>

  <!-- Constellation figure from trail — dots -->
  <g fill="#ffe066" opacity="0.7" filter="url(#sparkle)">
    <circle cx="355" cy="62" r="2"/>
    <circle cx="365" cy="72" r="1.5"/>
    <circle cx="372" cy="80" r="1.2"/>
  </g>
  <!-- figure body dots -->
  <g fill="#7ec8e3" opacity="0.5">
    <circle cx="400" cy="95" r="1.3"/>
    <circle cx="408" cy="100" r="1"/>
    <circle cx="415" cy="107" r="1.3"/>
    <circle cx="405" cy="108" r="1"/>
    <circle cx="398" cy="103" r="1"/>
    <!-- connect them -->
    <polyline points="400,95 408,100 415,107" fill="none" stroke="#7ec8e3" stroke-width="0.6"/>
    <polyline points="408,100 405,108 398,103" fill="none" stroke="#7ec8e3" stroke-width="0.6"/>
  </g>

  <!-- O letter overlay so it reads as O -->
  <text x="386" y="120" font-family="'Trebuchet MS', Arial, sans-serif" font-size="80" font-weight="800"
        fill="none" stroke="url(#textGrad2)" stroke-width="1.5" text-anchor="middle" opacity="0.15">O</text>

  <!-- Main subtitle -->
  <text x="240" y="158" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" fill="#7ec8e3"
        letter-spacing="3.5" text-anchor="middle" opacity="0.9">ТОЛКОВАНИЕ СНОВ · ИМЕНА · ГОРОСКОПЫ</text>

  <!-- Divider line -->
  <line x1="100" y1="130" x2="380" y2="130" stroke="#4a6fa5" stroke-width="0.7" opacity="0.5"/>

  <!-- Small glow dots at ends of divider -->
  <circle cx="100" cy="130" r="2" fill="#7ec8e3" opacity="0.4"/>
  <circle cx="380" cy="130" r="2" fill="#7ec8e3" opacity="0.4"/>

  <!-- Tag -->
  <text x="240" y="185" font-family="'Trebuchet MS', Arial, sans-serif" font-size="9.5" fill="#4a6fa5"
        letter-spacing="2" text-anchor="middle" opacity="0.7">RUYO.UZ</text>
</svg>
